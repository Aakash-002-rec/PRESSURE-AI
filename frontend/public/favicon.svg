<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="mockmind-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="48" height="48" rx="12" fill="#0f172a" />
  <rect width="46" height="46" x="1" y="1" rx="11" fill="none" stroke="#334155" stroke-width="1.5" />
  
  <!-- Stylized Mind / M Brain Circuit -->
  <path d="M12 34V16L24 25L36 16V34" stroke="url(#mockmind-grad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Neural Spark Nodes -->
  <circle cx="12" cy="16" r="2.5" fill="#fdba74" />
  <circle cx="24" cy="25" r="3" fill="#f97316" />
  <circle cx="36" cy="16" r="2.5" fill="#fdba74" />
  <circle cx="24" cy="12" r="2" fill="#fb923c" />
  <path d="M24 14V22" stroke="#fdba74" stroke-width="1.5" stroke-dasharray="2 1" />
</svg>